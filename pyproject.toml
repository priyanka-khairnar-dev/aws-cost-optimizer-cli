[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-cost-optimizer"
version = "0.1.0"
description = "Find waste in AWS accounts. Prioritized by impact, with a focus on AI workloads."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Priyanka" }]
keywords = ["aws", "cost-optimization", "finops", "cloud", "ai-infrastructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "boto3>=1.34.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "moto>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "boto3-stubs[ec2,cloudwatch,ce,pricing]>=1.34.0",
]

[project.scripts]
cost-optimizer = "cost_optimizer.cli:app"

[project.urls]
Homepage = "https://github.com/priyanka/aws-cost-optimizer-cli"
Issues = "https://github.com/priyanka/aws-cost-optimizer-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_optimizer"]

# ---- Ruff (linting + formatting) ----
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # allow assert False in tests

# ---- mypy (type checking) ----
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["moto.*"]
ignore_missing_imports = true

# ---- pytest ----
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=cost_optimizer",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring AWS credentials",
]

[tool.coverage.run]
branch = true
source = ["src/cost_optimizer"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
